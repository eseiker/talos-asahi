name: Track upstream releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: talos-asahi-upstream-update
  cancel-in-progress: false

jobs:
  update:
    name: update (${{ matrix.release_branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_branch: release-1.13
            track_asahi_updates: false
          - release_branch: release-1.14
            track_asahi_updates: true

    steps:
      - name: Check out tracker
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tracker
          persist-credentials: false

      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.release_branch }}
          path: release

      - name: Resolve latest release-line pins
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK_ASAHI_UPDATES: ${{ matrix.track_asahi_updates }}
          VERSIONS_FILE: ${{ github.workspace }}/release/versions.env
        run: ./tracker/scripts/update-upstream.sh

      - name: Create update branch
        if: steps.update.outputs.updated == 'true'
        id: branch
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ matrix.release_branch }}
          TALOS_VERSION: ${{ steps.update.outputs.talos_version }}
          ASAHI_KERNEL_TAG: ${{ steps.update.outputs.asahi_kernel_tag }}
          ASAHI_KERNEL_SHA: ${{ steps.update.outputs.asahi_kernel_sha }}
        run: |
          branch="automation/${RELEASE_BRANCH}/talos-${TALOS_VERSION}"
          if [[ -n "${ASAHI_KERNEL_TAG}" ]]; then
            branch="${branch}-${ASAHI_KERNEL_TAG}-${ASAHI_KERNEL_SHA:0:8}"
          fi
          echo "name=${branch}" >>"${GITHUB_OUTPUT}"

          existing_pr="$(gh pr list --state all --head "${branch}" --json url --jq '.[0].url // empty')"
          if [[ -n "${existing_pr}" ]]; then
            echo "created=false" >>"${GITHUB_OUTPUT}"
            echo "needs_pull_request=false" >>"${GITHUB_OUTPUT}"
            echo "existing_pull_request=${existing_pr}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "created=false" >>"${GITHUB_OUTPUT}"
            echo "needs_pull_request=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --create "${branch}"
          git add versions.env
          commit_message="build: track Talos ${TALOS_VERSION}"
          if [[ -n "${ASAHI_KERNEL_TAG}" ]]; then
            commit_message="${commit_message} and ${ASAHI_KERNEL_TAG}"
          fi
          git commit -m "${commit_message}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "created=true" >>"${GITHUB_OUTPUT}"
          echo "needs_pull_request=true" >>"${GITHUB_OUTPUT}"

      - name: Dispatch all kernel flavor test builds
        if: steps.branch.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh workflow run build.yml \
            --ref "${UPDATE_BRANCH}" \
            --field kernel_flavor=all \
            --field publish=false \
            --field publish_latest=false

      - name: Open draft pull request
        if: steps.branch.outputs.needs_pull_request == 'true'
        id: pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_BRANCH: ${{ matrix.release_branch }}
          TALOS_VERSION: ${{ steps.update.outputs.talos_version }}
          TALOS_SHA: ${{ steps.update.outputs.talos_sha }}
          PKGS_SHA: ${{ steps.update.outputs.pkgs_sha }}
          ASAHI_KERNEL_TAG: ${{ steps.update.outputs.asahi_kernel_tag }}
          ASAHI_KERNEL_SHA: ${{ steps.update.outputs.asahi_kernel_sha }}
          MAINLINE_KERNEL_VERSION: ${{ steps.update.outputs.mainline_kernel_version }}
        run: |
          title="build: track Talos ${TALOS_VERSION}"
          if [[ -n "${ASAHI_KERNEL_TAG}" ]]; then
            title="${title} and ${ASAHI_KERNEL_TAG}"
          fi

          asahi_summary=
          if [[ -n "${ASAHI_KERNEL_TAG}" ]]; then
            asahi_summary="- Asahi kernel: \`${ASAHI_KERNEL_TAG}\` (\`${ASAHI_KERNEL_SHA}\`)"
          fi

          gh pr create \
            --draft \
            --base "${RELEASE_BRANCH}" \
            --head "${UPDATE_BRANCH}" \
            --title "${title}" \
            --body "$(printf '%s\n' \
              "Automated upstream update for \`${RELEASE_BRANCH}\`." \
              '' \
              "- Talos: \`${TALOS_VERSION}\` (\`${TALOS_SHA}\`)" \
              "- pkgs: \`${PKGS_SHA}\`" \
              "${asahi_summary}" \
              "- mainline kernel: \`${MAINLINE_KERNEL_VERSION}\`" \
              '- build revision reset to `1` for Talos updates and incremented for Asahi-only rebuilds' \
              '' \
              'The tracker separately dispatched artifact-only Asahi, mainline 16K, and mainline 4K builds. Fix any patch conflicts in this branch, then merge and create the computed release tag manually.')"

      - name: Warn when pull request creation is disabled
        if: steps.pull_request.outcome == 'failure'
        run: |
          echo "::warning::The update branch and test build were created, but GitHub Actions is not allowed to create pull requests in this repository. Enable 'Allow GitHub Actions to create and approve pull requests' or open the update branch manually."

      - name: Summarize update
        if: steps.update.outputs.updated == 'true'
        env:
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_BRANCH: ${{ matrix.release_branch }}
          TALOS_VERSION: ${{ steps.update.outputs.talos_version }}
          ASAHI_KERNEL_TAG: ${{ steps.update.outputs.asahi_kernel_tag }}
        run: |
          {
            echo "## Upstream update"
            echo
            echo "- Release branch: \`${RELEASE_BRANCH}\`"
            echo "- Talos: \`${TALOS_VERSION}\`"
            if [[ -n "${ASAHI_KERNEL_TAG}" ]]; then
              echo "- Asahi kernel: \`${ASAHI_KERNEL_TAG}\`"
            fi
            echo "- Branch: \`${UPDATE_BRANCH}\`"
            if [[ "${{ steps.branch.outputs.created }}" == "true" ]]; then
              echo "- Asahi, mainline 16K, and mainline 4K test builds dispatched"
            else
              echo "- Existing update branch or pull request retained"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
