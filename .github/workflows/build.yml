name: Build and publish Asahi Talos

on:
  workflow_dispatch:
    inputs:
      kernel_flavor:
        description: Kernel source to build
        required: true
        type: choice
        options:
          - asahi
          - mainline
          - mainline-4k
          - v1.15
          - both
          - all
        default: asahi
      publish:
        description: Publish installer and component images to GHCR
        required: true
        type: boolean
        default: false
      publish_latest:
        description: Also move the installer:latest tag
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub release when dispatched on a tag
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*-asahi.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: talos-asahi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.kernel_flavor }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kernel_flavor: ${{ (github.event_name == 'push' || inputs.kernel_flavor == 'all') && fromJSON('["asahi","mainline","mainline-4k","v1.15"]') || inputs.kernel_flavor == 'both' && fromJSON('["asahi","mainline"]') || fromJSON(format('["{0}"]', inputs.kernel_flavor)) }}
    env:
      LOCAL_REGISTRY: localhost:5000
      PROGRESS: plain
      KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx with local registry access
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Start ephemeral build registry
        run: |
          docker run --detach --rm --name talos-asahi-registry \
            --publish 127.0.0.1:5000:5000 registry:2
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Resolve release tag
        shell: bash
        run: |
          talos_version="$(sed -n 's/^TALOS_VERSION=//p' versions.env)"
          build_revision="$(sed -n 's/^BUILD_REVISION=//p' versions.env)"
          release_tag="${talos_version}-asahi.${build_revision}"
          case "${KERNEL_FLAVOR}" in
            asahi)
              artifact_tag="${release_tag}"
              ;;
            mainline)
              artifact_tag="${release_tag}-mainline"
              ;;
            mainline-4k)
              artifact_tag="${release_tag}-mainline-4k"
              ;;
            v1.15)
              artifact_tag="${release_tag}-v1.15"
              ;;
            *)
              echo "unsupported kernel flavor ${KERNEL_FLAVOR}" >&2
              exit 1
              ;;
          esac
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match versions.env release ${release_tag}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >>"${GITHUB_ENV}"
          echo "ARTIFACT_TAG=${artifact_tag}" >>"${GITHUB_ENV}"
          target_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TARGET_REPOSITORY=${target_repository}" >>"${GITHUB_ENV}"
          echo "KERNEL_CACHE_IMAGE=${target_repository}/build-cache:kernel-arm64-${KERNEL_FLAVOR}" >>"${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and boot bundle
        run: ./scripts/build.sh

      - name: Publish GHCR images
        if: github.event_name == 'push' || inputs.publish
        env:
          PUBLISH_LATEST: ${{ env.KERNEL_FLAVOR == 'asahi' && github.event_name == 'workflow_dispatch' && inputs.publish_latest }}
        run: ./scripts/publish.sh

      - name: Upload boot bundles
        uses: actions/upload-artifact@v4
        with:
          name: talos-asahi-${{ env.ARTIFACT_TAG }}
          path: |
            _out/talos-asahi-*-esp.zip
            _out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish_release)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download all kernel flavor artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: talos-asahi-*
          path: _release-input

      - name: Prepare release assets
        shell: bash
        run: |
          asahi_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}/talos-asahi-${GITHUB_REF_NAME}-esp.zip"
          mainline_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-mainline/talos-asahi-${GITHUB_REF_NAME}-mainline-esp.zip"
          mainline_4k_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-mainline-4k/talos-asahi-${GITHUB_REF_NAME}-mainline-4k-esp.zip"
          asahi_longhorn_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}/talos-asahi-${GITHUB_REF_NAME}-longhorn-esp.zip"
          mainline_longhorn_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-mainline/talos-asahi-${GITHUB_REF_NAME}-mainline-longhorn-esp.zip"
          mainline_4k_longhorn_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-mainline-4k/talos-asahi-${GITHUB_REF_NAME}-mainline-4k-longhorn-esp.zip"
          v1_15_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-v1.15/talos-asahi-${GITHUB_REF_NAME}-v1.15-esp.zip"
          v1_15_longhorn_bundle="_release-input/talos-asahi-${GITHUB_REF_NAME}-v1.15/talos-asahi-${GITHUB_REF_NAME}-v1.15-longhorn-esp.zip"

          for asset in \
            "${asahi_bundle}" \
            "${mainline_bundle}" \
            "${mainline_4k_bundle}" \
            "${v1_15_bundle}" \
            "${asahi_longhorn_bundle}" \
            "${mainline_longhorn_bundle}" \
            "${mainline_4k_longhorn_bundle}" \
            "${v1_15_longhorn_bundle}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "missing release asset ${asset}" >&2
              exit 1
            fi
          done

          mkdir -p _release
          cp \
            "${asahi_bundle}" \
            "${mainline_bundle}" \
            "${mainline_4k_bundle}" \
            "${v1_15_bundle}" \
            "${asahi_longhorn_bundle}" \
            "${mainline_longhorn_bundle}" \
            "${mainline_4k_longhorn_bundle}" \
            "${v1_15_longhorn_bundle}" \
            _release/
          (
            cd _release
            sha256sum talos-asahi-*-esp.zip >SHA256SUMS
          )

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          source ./scripts/release-policy.sh

          release_args=(
            --verify-tag
            --title "Talos Asahi ${GITHUB_REF_NAME}"
            --generate-notes
            --latest=false
          )
          if [[ "$(release_channel "${GITHUB_REF_NAME}")" == "prerelease" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${release_args[@]}" \
            _release/talos-asahi-*-esp.zip \
            _release/SHA256SUMS

  promote-latest:
    name: promote stable Latest aliases
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish_release)
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: talos-asahi-latest-promotion
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide whether to promote this release
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          source ./scripts/release-policy.sh

          candidate="${GITHUB_REF_NAME}"
          channel="$(release_channel "${candidate}")"
          if [[ "${channel}" == "prerelease" ]]; then
            echo "promote=false" >>"${GITHUB_OUTPUT}"
            echo "${candidate} is a prerelease; stable Latest aliases are unchanged"
            exit 0
          fi

          current="$(gh release view --json tagName --jq .tagName)"

          if stable_release_at_least "${candidate}" "${current}"; then
            echo "promote=true" >>"${GITHUB_OUTPUT}"
            echo "promoting ${candidate}; current Latest is ${current}"
          else
            status=$?
            if [[ ${status} -eq 2 ]]; then
              echo "cannot compare stable release tags ${candidate} and ${current}" >&2
              exit 1
            fi

            echo "promote=false" >>"${GITHUB_OUTPUT}"
            echo "keeping ${current}; ${candidate} is older"
          fi

      - name: Log in to GHCR
        if: steps.policy.outputs.promote == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote GitHub and GHCR Latest aliases
        if: steps.policy.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          target_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "${target_repository}/installer:latest" \
            "${target_repository}/installer:${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --latest
