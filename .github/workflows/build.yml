name: Build and publish Asahi Talos

on:
  workflow_dispatch:
    inputs:
      kernel_flavor:
        description: Kernel source to build
        required: true
        type: choice
        options:
          - asahi
          - mainline
        default: asahi
      publish:
        description: Publish installer and component images to GHCR
        required: true
        type: boolean
        default: false
      publish_latest:
        description: Also move the installer:latest tag
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*-asahi.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: talos-asahi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      LOCAL_REGISTRY: localhost:5000
      PROGRESS: plain
      KERNEL_FLAVOR: ${{ inputs.kernel_flavor || 'asahi' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Buildx with local registry access
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: Start ephemeral build registry
        run: |
          docker run --detach --rm --name talos-asahi-registry \
            --publish 127.0.0.1:5000:5000 registry:2
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Resolve release tag
        shell: bash
        run: |
          talos_version="$(sed -n 's/^TALOS_VERSION=//p' versions.env)"
          build_revision="$(sed -n 's/^BUILD_REVISION=//p' versions.env)"
          release_tag="${talos_version}-asahi.${build_revision}"
          case "${KERNEL_FLAVOR}" in
            asahi)
              artifact_tag="${release_tag}"
              ;;
            mainline)
              artifact_tag="${release_tag}-mainline"
              ;;
            *)
              echo "unsupported kernel flavor ${KERNEL_FLAVOR}" >&2
              exit 1
              ;;
          esac
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${KERNEL_FLAVOR}" != "asahi" ]]; then
            echo "tag builds must use the asahi kernel flavor" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match versions.env release ${release_tag}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >>"${GITHUB_ENV}"
          echo "ARTIFACT_TAG=${artifact_tag}" >>"${GITHUB_ENV}"
          target_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TARGET_REPOSITORY=${target_repository}" >>"${GITHUB_ENV}"
          echo "KERNEL_CACHE_IMAGE=${target_repository}/build-cache:kernel-arm64-${KERNEL_FLAVOR}" >>"${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and boot bundle
        run: ./scripts/build.sh

      - name: Publish GHCR images
        if: env.KERNEL_FLAVOR == 'asahi' && (github.event_name == 'push' || inputs.publish)
        env:
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest }}
        run: ./scripts/publish.sh

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "Talos Asahi ${RELEASE_TAG}" \
            --generate-notes \
            _out/BOOTAA64.EFI \
            _out/Talos-*.efi \
            _out/loader.conf \
            _out/talos-asahi-*-boot.tar.gz \
            _out/installer-arm64.tar \
            _out/SHA256SUMS \
            _out/build.env

      - name: Upload boot bundle and installer archive
        uses: actions/upload-artifact@v4
        with:
          name: talos-asahi-${{ env.ARTIFACT_TAG }}
          path: |
            _out/BOOTAA64.EFI
            _out/Talos-*.efi
            _out/loader.conf
            _out/talos-asahi-*-boot.tar.gz
            _out/installer-arm64.tar
            _out/SHA256SUMS
            _out/build.env
          if-no-files-found: error
          retention-days: 30
